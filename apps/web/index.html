    />

    <!--
      Pre-React theme bootstrap. Dark is the default; we strip the `dark` class
      only if the user previously toggled to light. Runs synchronously before
      anything paints, so no flash of dark-then-light (or vice versa).
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('theme-storage');
          if (raw) {
            var parsed = JSON.parse(raw);
            var mode = parsed && parsed.state && parsed.state.mode;
            if (mode === 'light') document.documentElement.classList.remove('dark');
          }
        } catch (e) { /* fall back to the html.dark default */ }
      })();
    </script>

    <!-- Organization schema -->
    <script type="application/ld+json">

    <!-- WebSite schema with SearchAction (lets Google show a search box in results) -->
    <script type="application/ld+json">

      }
    </script>
