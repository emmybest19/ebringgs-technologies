<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!--
      Pre-React theme bootstrap. Dark is the default; we strip the `dark` class
      only if the user previously toggled to light. Runs synchronously before
      anything paints, so no flash of dark-then-light (or vice versa).
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('theme-storage');
          if (raw) {
            var parsed = JSON.parse(raw);
            var mode = parsed && parsed.state && parsed.state.mode;
            if (mode === 'light') document.documentElement.classList.remove('dark');
          }
        } catch (e) { /* fall back to the html.dark default */ }
      })();
    </script>
    <title>E-Bringgs Technologies</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
