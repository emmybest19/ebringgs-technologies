<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0d9488" media="(prefers-color-scheme: light)" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Admin console is fully private — block all crawlers + cross-site referrer leaks -->
    <title>E-Bringgs · Admin Console</title>
    <meta name="description" content="E-Bringgs internal admin console." />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />

    <!-- Open Graph (limited, mostly for internal Slack/email previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="E-Bringgs Admin" />
    <meta property="og:title" content="E-Bringgs · Admin Console" />
    <meta property="og:locale" content="en_US" />

    <!-- Icons + PWA -->
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <link rel="shortcut icon" type="image/png" href="/logo-mark.png" />
    <link rel="apple-touch-icon" href="/logo-mark.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="E-Bringgs Admin" />
    <meta name="application-name" content="E-Bringgs Admin" />
    <meta name="msapplication-TileColor" content="#0d9488" />

    <!-- Performance -->
    <link rel="preconnect" href="https://ebringgs-backend.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://ebringgs-backend.onrender.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var raw = localStorage.getItem('theme-storage');
          if (raw) {
            var parsed = JSON.parse(raw);
            var mode = parsed && parsed.state && parsed.state.mode;
            if (mode === 'light') document.documentElement.classList.remove('dark');
          }
        } catch (e) { /* fall back to the html.dark default */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
